name: ci

on:
  push:
    branches: [main]
  pull_request:

# One line has to mean one thing on every runner. The Windows runner's
# default shell is PowerShell, which does not read `-coverprofile=cov.out`
# the way bash does, and sends the profile to a file no step refers to.
#
# At WORKFLOW level rather than job level, so a job added later inherits
# it. A job-level block fixes the forgetting exactly one level up.
#
# Two things it does not do. It does not reach a `uses:` step or the
# shell inside a composite action — those are the action's own. And an
# explicit `shell: bash` is not the implicit default: it runs
# `bash --noprofile --norc -eo pipefail`, so pipefail is on for the
# Linux and macOS runs too. That is strictness in the right direction
# and it is a behavior change, not only a normalization.
defaults:
  run:
    shell: bash

# Read-only at the top, and each job raises only what it needs, as in
# release.yml and codeql.yml: Scorecard's Token-Permissions check wants
# "contents: read" at the top level and write declared per job.
# https://github.com/ossf/scorecard/blob/main/docs/checks.md#token-permissions
permissions:
  contents: read

# A push that supersedes an earlier one cancels it: two runs of the same
# branch prove one thing between them, and the older one is the one
# nobody is waiting for. main is exempt, because a canceled run there
# leaves a commit with no verdict at all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Every action is pinned to a full commit SHA, with its version in a
      # trailing comment that Dependabot keeps in step. A tag "can be moved
      # or deleted if a bad actor gains access to the repository storing
      # the action", in GitHub's words; a SHA cannot.
      # https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No checkout keeps its token. Nothing in these workflows pushes,
        # and a persisted token is readable by every later step.
        # https://github.com/actions/checkout/blob/v7.0.1/README.md
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -coverpkg=./internal/... -coverprofile=cov.out -covermode=atomic ./...
      # On every platform, not only Linux. A gate that reads one runner's
      # output is a gate that cannot see a test skipped on another, and a
      # platform in the matrix that no gate reads is a platform nobody is
      # testing.
      - name: coverage floor
        run: go run ./scripts/gates coverage cov.out 80

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: out=$(gofmt -l .); [ -z "$out" ] || { echo "$out"; exit 1; }
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: licenses
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC
      # The Makefile holds the linter's command and its version, so `make
      # check` runs exactly this.
      - name: actionlint
        run: make actionlint

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans HEAD's whole history, so a shallow clone would
          # hide a credential a commit added and a later one removed.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A cache of its own, keyed by the Makefile that pins gitleaks too.
          # The other jobs share go.sum's key and save a cache without
          # gitleaks, and setup-go saves nothing over a hit on its key, so on
          # that key gitleaks is built from source on every run.
          # https://github.com/actions/setup-go/blob/b7ad1dad31e06c5925ef5d2fc7ad053ef454303e/src/cache-save.ts#L75-L80
          cache-dependency-path: |
            go.sum
            Makefile
      # The Makefile holds the scanner's command and its version, so
      # `make check` runs exactly this.
      - name: gitleaks
        run: make gitleaks
      # gitleaks knows about credentials. This knows about everything else
      # a live run against a real Drive can drag in: addresses, file ids,
      # and links carrying one.
      - run: go run ./scripts/gates leaks
      # The tool a release action installs has a version of its own,
      # apart from the action's SHA, and a range there floats while it
      # reads like a pin. A comment cannot hold it shut; this gate does.
      - run: go run ./scripts/gates pins
      # A class is what a model branches on, and this holds the code to
      # the list: one invented at a call site, or listed and never
      # emitted, would otherwise read as silence.
      - run: go run ./scripts/gates classes
      - run: go run ./scripts/gates api-coverage
      - run: go run ./scripts/gates api-fields
      - run: go run ./scripts/gates mcpb
      - run: go run ./scripts/gates transcript
      - run: go run ./scripts/gates outcomes
      - run: go run ./scripts/gates registry
      - run: go run ./scripts/gates parity

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The flags `make build` and schema-ack build the server with. Set for
    # the job, so `go run ./scripts/gates`, which imports most of the
    # server, compiles with them too rather than compiling it twice.
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o google-drive-mcp ./cmd/google-drive-mcp
      - run: go run ./scripts/gates smoke ./google-drive-mcp
      - run: go run ./scripts/gates schema-diff ./google-drive-mcp
      - run: go run ./scripts/gates staleness ./google-drive-mcp
      - run: go run ./scripts/gates docs
      - run: go run ./scripts/gates live-cover ./google-drive-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemas
          path: schemas.json

  # A pull request whose tool surface changes says so in a commit footer
  # naming each item, since an annotation or an instruction change breaks
  # no schema and still changes what a client does. It measures from the
  # merge-base, which only a pull request has, so it is not in `make
  # check`.
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_BASE_REF: origin/${{ github.base_ref }}
      # The head commit, not the merge commit the checkout sits on.
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      # schema-ack builds both sides with these; `go run` uses them too.
      CGO_ENABLED: "0"
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: schema change acknowledged
        run: go run ./scripts/gates schema-ack "$PR_BASE_REF" "$PR_HEAD"
