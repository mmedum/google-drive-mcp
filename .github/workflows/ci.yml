name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push that supersedes an earlier one cancels it: two runs of the same
# branch prove one thing between them, and the older one is the one
# nobody is waiting for. main is exempt, because a cancelled run there
# leaves a commit with no verdict at all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # One line has to mean one thing on all three runners. The Windows
    # runner's default shell is PowerShell, which turned
    # `-coverprofile=cov.out` into a file called `cov`, so the profile
    # was written under a name no step refers to. Nothing noticed while
    # the only step that read it was skipped on that platform — which is
    # the same blind spot as running the gate on one runner, arriving
    # from the other side.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -coverpkg=./internal/... -coverprofile=cov.out -covermode=atomic ./...
      # On every platform, not only Linux. A gate that reads one runner's
      # output is a gate that cannot see a test skipped on another, and a
      # platform in the matrix that no gate reads is a platform nobody is
      # testing.
      - name: coverage floor
        run: go run ./scripts/gates coverage cov.out 80

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: out=$(gofmt -l .); [ -z "$out" ] || { echo "$out"; exit 1; }
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-mode: goinstall
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: licenses
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # gitleaks knows about credentials. This knows about everything else
      # a live run against a real Drive can drag in: addresses, file ids,
      # and links carrying one.
      - run: go run ./scripts/gates leaks
      # The tool a release action installs is a separate version from the
      # action's own SHA, and a range there has floated twice (see §18 of
      # docs/architecture.md). A comment could not hold it shut.
      - run: go run ./scripts/gates pins
      # A class is what a model branches on, and until this ran nothing
      # held the code to the list: one could be invented at a call site,
      # or listed and never emitted, and both read as silence.
      - run: go run ./scripts/gates classes

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o google-drive-mcp ./cmd/google-drive-mcp
      - run: go run ./scripts/gates smoke ./google-drive-mcp
      - run: go run ./scripts/gates schema-diff ./google-drive-mcp
      - run: go run ./scripts/gates staleness ./google-drive-mcp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemas
          path: schemas.json
