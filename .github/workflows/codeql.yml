name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a rule added after a merge still finds old code.
    - cron: "0 3 * * 1"

# One line has to mean one thing on every runner. The Windows runner's
# default shell is PowerShell, which does not read `-coverprofile=cov.out`
# the way bash does: the profile went to a file no step refers to, and
# nothing noticed while the only step that read it was skipped on that
# platform.
#
# At WORKFLOW level rather than job level, so a job somebody adds next
# month inherits it. A job-level block fixes the forgetting exactly one
# level up.
#
# Two things it does not do. It does not reach a `uses:` step or the
# shell inside a composite action — those are the action's own. And an
# explicit `shell: bash` is not the implicit default: it runs
# `bash --noprofile --norc -eo pipefail`, so pipefail is on for the
# Linux and macOS runs too. That is strictness in the right direction
# and it is a behaviour change, not only a normalisation.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
