name: release

on:
  push:
    tags: ["v*"]
  # Pushing more than three tags at once makes GitHub drop the tag
  # events, and a release job can fail for reasons that have nothing to
  # do with the tag, so it can also be run by hand against a tag.
  workflow_dispatch:

# Read by default; the release job raises only what it needs.
# One line has to mean one thing on every runner. The Windows runner's
# default shell is PowerShell, which does not read `-coverprofile=cov.out`
# the way bash does: the profile went to a file no step refers to, and
# nothing noticed while the only step that read it was skipped on that
# platform.
#
# At WORKFLOW level rather than job level, so a job somebody adds next
# month inherits it. A job-level block fixes the forgetting exactly one
# level up.
#
# Two things it does not do. It does not reach a `uses:` step or the
# shell inside a composite action — those are the action's own. And an
# explicit `shell: bash` is not the implicit default: it runs
# `bash --noprofile --norc -eo pipefail`, so pipefail is on for the
# Linux and macOS runs too. That is strictness in the right direction
# and it is a behaviour change, not only a normalisation.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Keyless signing and build provenance both prove who built the
      # artifacts, and both need an OIDC token to do it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Both of these install a tool, and pinning the action does not pin
      # what it installs. The first v0.0.1 attempt failed because cosign
      # had moved to bundles since this workflow was written, so the
      # versions are named here as well as the actions.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # The action is pinned by SHA and the tool it installs is
          # pinned beside it, the same way cosign and syft are above.
          # No "~>": the action's own README says that operator gives "a
          # max satisfying semver one", so "~> v2.18.0" would still let
          # any 2.18.x decide what the artifacts are. An exact version is
          # the only form that is a pin (see §18 of docs/architecture.md).
          version: "v2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Provenance ties every published archive to this workflow, this
      # commit and this runner, checkable with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt"
