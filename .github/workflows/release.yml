name: release

on:
  push:
    tags: ["v*"]
  # Pushing more than three tags at once makes GitHub drop the tag
  # events, and a release job can fail for reasons that have nothing to
  # do with the tag, so it can also be run by hand against a tag.
  workflow_dispatch:

# One line has to mean one thing on every runner. The Windows runner's
# default shell is PowerShell, which does not read `-coverprofile=cov.out`
# the way bash does, and sends the profile to a file no step refers to.
#
# At WORKFLOW level rather than job level, so a job added later inherits
# it. A job-level block fixes the forgetting exactly one level up.
#
# Two things it does not do. It does not reach a `uses:` step or the
# shell inside a composite action — those are the action's own. And an
# explicit `shell: bash` is not the implicit default: it runs
# `bash --noprofile --norc -eo pipefail`, so pipefail is on for the
# Linux and macOS runs too. That is strictness in the right direction
# and it is a behavior change, not only a normalization.
defaults:
  run:
    shell: bash

# Read by default; the release job raises only what it needs.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Keyless signing and build provenance both prove who built the
      # artifacts, and both need an OIDC token to do it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Both of these install a tool, and pinning the action does not pin
      # what it installs, so the versions are named here as well as the
      # actions. In cosign 3 the --bundle output flag is required, so a
      # cosign that floats across a major changes what signing needs.
      # https://github.com/sigstore/cosign/releases/tag/v3.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.51.1
      - name: Release notes from the CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: go run ./scripts/gates release-notes "${REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # The action is pinned by SHA and the tool it installs is
          # pinned beside it, the same way cosign and syft are above.
          # No "~>": the action's own README says that operator gives "a
          # max satisfying semver one", so "~> v2.18.0" would still let
          # any 2.18.x decide what the artifacts are. An exact version is
          # the only form that is a pin, and `gates pins` holds it.
          # https://github.com/goreleaser/goreleaser-action/blob/v7.3.0/README.md#inputs
          version: "v2.18.0"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Provenance ties every published archive to this workflow, this
      # commit and this runner, checkable with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The bundle is a subject in its own right. Its row in
          # checksums.txt is a claim about the checksum file rather than
          # about the bundle: without this, `gh attestation verify` on the
          # .mcpb answers 404 while every archive passes. The bundle is
          # what most people actually install.
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/*.mcpb,dist/checksums.txt"

  # After the release, never inside it. The registry sends a HEAD to the
  # bundle's download URL before it accepts the entry, so an entry
  # published while goreleaser is still uploading names a download nobody
  # can fetch. GitHub answers that HEAD with a 302 to a signed asset URL,
  # which the registry's validator accepts explicitly — a check that only
  # took 200 would reject every GitHub release there is.
  #
  # A separate workflow rather than a last step, so it can be run again
  # on its own: `gh workflow run publish-mcp.yml -f tag=vX.Y.Z`. A step
  # that can only run at the end of a release is a step whose only
  # recovery is another release.
  registry:
    needs: goreleaser
    uses: ./.github/workflows/publish-mcp.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read
