version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - unparam
    - gocritic
    - revive
    - bodyclose
    - errorlint
    - nilerr
    - prealloc
    - makezero
    - forbidigo
  settings:
    misspell:
      locale: US
    forbidigo:
      # The MCP spec's stdio transport is normative: the server MUST NOT
      # write anything to stdout that is not a valid MCP message, and MAY
      # log to stderr. A stray print corrupts the JSON-RPC stream and the
      # client silently stops working, so the process's streams are named
      # in exactly one place and forbidden everywhere else.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: stdout carries only MCP JSON-RPC frames; write through the boundary helpers
        - pattern: ^os\.Stdout$
          msg: stdout carries only MCP JSON-RPC frames; take an io.Writer instead
    gocyclo:
      min-complexity: 25
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: unused-parameter
        - name: empty-block
        - name: unreachable-code
  exclusions:
    rules:
      # scripts/ is maintainer tooling run at a terminal, not the server.
      - path: ^scripts/
        linters: [forbidigo]
      - path: _test\.go
        linters: [gocyclo, unparam, errcheck, bodyclose, revive, prealloc]
      # CANCELLED is Google's approval status, spelled as the API sends it.
      - linters: [misspell]
        text: "`CANCELLED` is a misspelling"

formatters:
  enable:
    - gofmt
