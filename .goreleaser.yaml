version: 2

project_name: google-drive-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/google-drive-mcp
    binary: google-drive-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Stamp the commit's time rather than the build's, so rebuilding the
    # same tag produces byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/mmedum/google-drive-mcp/internal/version.Version={{.Version}}

# The universal macOS binary exists for the Claude Desktop bundle alone.
# A bundle manifest names a command per platform and has no key for the
# architecture, so the macOS entry has to work on both, and this is how
# macOS does that. `ids` below keeps it out of the ordinary archives: a
# fourth macOS download on the release page would be a choice nobody
# should have to make.
universal_binaries:
  - id: universal
    ids: [server]
    replace: false
    hooks:
      # The one point in the pipeline where every binary exists and
      # checksums.txt has not been written, which is what MAKES it
      # possible for the bundle to be in that file and therefore under
      # the signature. It is not what puts it there: goreleaser hashes
      # the artifacts it built, and a file a hook drops into dist/ is not
      # one. `checksum.extra_files` below covers it and
      # `release.extra_files` uploads it — both, or the bundle ships
      # unsigned, or not at all, while looking no different here.
      post: go run ./scripts/gates mcpb-pack {{ .Version }} dist

archives:
  - ids: [server]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  # The bundle is not an archive goreleaser built, so it has to be named
  # for the checksum file to cover it — and being in checksums.txt is
  # what gets it signed, since the signature is over that file.
  extra_files:
    - glob: ./dist/*.mcpb

# One SBOM per archive, so a deployer can see what is inside a binary
# they did not build.
sboms:
  - artifacts: archive

# Sign the checksum file with a keyless Sigstore certificate tied to the
# workflow's OIDC identity: no private key to hold or leak.
#
# cosign 3 writes a bundle carrying the signature and the certificate
# together. --bundle moved from optional to *required* in v3 — its v3.0.1
# release notes say exactly that, and say nothing about the old
# --output-signature and --output-certificate being deprecated or
# ignored — so a config carrying only those two gives cosign no output
# path at all. That is the empty-path error the first v0.0.1 release
# attempt died on: it failed rather than degraded, because the action was
# pinned and the tool it installs was not (see .github/workflows).
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  # A tag is the decision; a draft nobody publishes is how releases go
  # missing. Tags carrying a suffix like -rc1 are marked pre-release.
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./dist/*.mcpb
  footer: |
    Built by GoReleaser from the tag. Verify a download against
    `checksums.txt`; every archive carries the binary, LICENSE and README.

    `.mcpb` is the Claude Desktop bundle: open it and Claude Desktop
    installs the server and asks for your OAuth client JSON, with no
    config file to edit. It covers macOS, Windows and Linux on both
    architectures. It does **not** log you in — install the binary as
    well, run `google-drive-mcp login` once, and the bundle picks up the
    same credentials. Its SHA-256 is in the same signed `checksums.txt`.
