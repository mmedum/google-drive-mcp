version: 2

project_name: google-drive-mcp

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/google-drive-mcp
    binary: google-drive-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Stamp the commit's time rather than the build's, so rebuilding the
    # same tag produces byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/mmedum/google-drive-mcp/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# One SBOM per archive, so a deployer can see what is inside a binary
# they did not build.
sboms:
  - artifacts: archive

# Sign the checksum file with a keyless Sigstore certificate tied to the
# workflow's OIDC identity: no private key to hold or leak.
#
# cosign 3 writes a bundle carrying the signature and the certificate
# together; the separate --output-signature and --output-certificate
# flags are deprecated and, with the new bundle format, ignored. The
# first release attempt failed on exactly that, because the action was
# pinned and the tool it installs was not (see .github/workflows).
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  # A tag is the decision; a draft nobody publishes is how releases go
  # missing. Tags carrying a suffix like -rc1 are marked pre-release.
  draft: false
  prerelease: auto
  footer: |
    Built by GoReleaser from the tag. Verify a download against
    `checksums.txt`; every archive carries the binary, LICENSE and README.
